name: Apply supplied academy update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/academy-client-update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified client photos
        run: |
          curl --fail --location --retry 3 'https://sb-4qfpeca1c693.vercel.run/client-photos.zip' -o /tmp/client-photos.zip
          echo '6b7c6de54a317ea6a853351195881f9f04fc12e61a19c73a420000d11b0b9314  /tmp/client-photos.zip' | sha256sum --check
      - name: Apply academy text and photos
        run: |
          python3 - <<'PY'
          import json,zipfile,re
          from pathlib import Path
          files=json.loads(Path('scripts/academy-client-update.json').read_text())
          for name,content in files.items():
              if name not in ['dist/index.html','dist/styles.css','dist/app.js','scripts/check-site.mjs']:
                  raise ValueError(name)
              Path(name).write_text(content)
          with zipfile.ZipFile('/tmp/client-photos.zip') as z:
              assert len(z.namelist()) == 43
              for name in z.namelist():
                  assert re.fullmatch(r'client-(home|photo)-[0-9]{2}\.jpg',name), name
                  Path('dist/assets',name).write_bytes(z.read(name))
          PY
          node scripts/check-site.mjs
          git rm .github/workflows/academy-client-update.yml scripts/academy-client-update.json
          git add dist/index.html dist/app.js dist/styles.css scripts/check-site.mjs dist/assets/client-*.jpg
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update Dynamic Karate & Dance Academy details and client photos"
          git push origin HEAD:main
